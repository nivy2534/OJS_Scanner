id: idor-ojs
name: IDOR — OJS Authenticated Endpoints
severity: high
type: idor

tests:
  - unauthenticated
  - sequential

protected_patterns:
  - "/management/"
  - "/submissions"
  - "/manageIssues"
  - "/stats/"
  - "/workflow/"
  - "/submission/wizard"
  - "/api/v1/users"
  - "/api/v1/_submissions"
  - "/user/profile"

sensitive_words:
  - "email"
  - "username"
  - "submission"
  - "author"
  - "reviewer"
  - "affiliation"
  - "token"