id: xss-reflected
name: Reflected XSS
severity: high
type: fuzz

requests:
  - method: GET
    targets: [query_params]
    fuzzing:
      - mode: replace
        payloads:
          - "<script>alert(1)</script>"
          - "<img src=x onerror=alert(1)>"
          - "'\"><svg onload=alert(1)>"
          - "javascript:alert(1)"

matchers:
  - type: word
    part: body
    condition: or
    words:
      - "<script>alert(1)</script>"
      - "onerror=alert(1)"
      - "onload=alert(1)"

  - type: status
    status: [200]